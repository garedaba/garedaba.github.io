<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>{{ site.title }}</title>
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" href="{{ "/favicon-32x32.png" | relative_url }}" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <meta name="robots" content="noindex">
  </head>
  <body>
    <p>Redirecting to <a href="{{ page.redirect_to | relative_url }}">{{ site.title }}</a>&hellip;</p>
  </body>
</html>
